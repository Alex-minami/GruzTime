name: Inject calculator loader

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inject-calculator.yml"

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject calculator script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="calculator.js?v=20260818-1"></script>'
          if tag not in s:
              s = s.replace('</body>', '  ' + tag + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Load price calculator"
            git push
          fi
